<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Music Player</title>

<link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&family=Courgette&family=Elsie:wght@400;900&family=Gamja+Flower&family=Hachi+Maru+Pop&family=Just+Another+Hand&family=Montserrat:wght@400;500;600;700&family=Pathway+Gothic+One&family=Pixelify+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&family=Pompiere&family=Press+Start+2P&family=Schoolbell&family=Sue+Ellen+Francisco&family=Yomogi&display=swap" rel="stylesheet">

<style>
:root{
  --header-color:#8a8a8a;
  --title-color:#1a1a1a;
  --song-title-color:#1a1a1a;
  --artist-color:#767676;
  --bg-color:#fff;
  --font-family:'Montserrat',sans-serif;
  --scale:1;
  --text-scale:1;
  --pattern-opacity:.35;
  --accent-color:#1a1a1a;
  --photo-size:190px;

  --radius-player:8px;
  --radius-song:5px;
  --radius-btn:5px;
  --radius-cover:6px;

  --outline-color:#E6E5E3;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:transparent!important;
}

body{
  display:flex;
  align-items:flex-start;
  justify-content:center;
  padding:4px;
  overflow:hidden;
  font-family:Arial,sans-serif;
}

.player{
  width:320px;
  transform:scale(var(--scale));
  transform-origin:top center;
  background:var(--bg-color);
  border:1px solid var(--outline-color);
  border-radius:var(--radius-player);
  overflow:hidden;
  box-shadow:0 6px 18px rgba(0,0,0,.1);
  position:relative;
}

.player[data-pattern="grid"]{
  background-image:
    linear-gradient(
      to right,
      rgba(120,120,120,var(--pattern-opacity)) 1px,
      transparent 1px
    ),
    linear-gradient(
      to bottom,
      rgba(120,120,120,var(--pattern-opacity)) 1px,
      transparent 1px
    );
  background-size:20px 20px;
}

.player[data-pattern="dots"]{
  background-image:radial-gradient(
    rgba(120,120,120,var(--pattern-opacity)) 1.4px,
    transparent 1.4px
  );
  background-size:16px 16px;
}

.header{
  background:var(--header-color);
  padding:12px 14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  border-bottom:1px solid var(--outline-color);
}

.header .title{
  color:var(--title-color);
  font-family:var(--font-family);
  font-weight:600;
  font-size:calc(16px * var(--text-scale));
  letter-spacing:.3px;
  outline:none;
  border-radius:4px;
  padding:2px 6px;
  margin:-2px -6px;
  cursor:text;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  flex:1;
  min-width:0;
}

.header .title:hover{
  background:rgba(255,255,255,.25);
}

.header .title:focus{
  background:rgba(255,255,255,.4);
}

.menu-btn{
  width:26px;
  height:26px;
  background:#fff;
  border:1px solid var(--outline-color);
  border-radius:var(--radius-btn);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  font-size:14px;
  user-select:none;
  flex-shrink:0;
}

.menu-btn:hover{
  background:#f0f0f0;
  transform:rotate(45deg);
}

.cover{
  margin:16px auto 8px;
  width:var(--photo-size);
  height:var(--photo-size);
  border:1px solid var(--outline-color);
  border-radius:var(--radius-cover);
  display:flex;
  align-items:center;
  justify-content:center;
  color:#aaa;
  font-size:13px;
  overflow:hidden;
  background:#fafafa;
  flex-direction:column;
  gap:6px;
  transition:.2s;
}

.cover.circle{
  border-radius:50%;
}

.cover.round-square{
  border-radius:25px;
}

.cover.heart{
  border:none;
  background:transparent;
  clip-path:path(
    "M85 155 C78 148 12 107 12 50 C12 17 55 7 85 40 C115 7 158 17 158 50 C158 107 92 148 85 155 Z"
  );
}

.cover img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.scrub-wrap{
  padding:0 18px;
  margin-top:4px;
}

.time-row{
  display:flex;
  justify-content:space-between;
  font-size:12px;
  color:#333;
  margin-bottom:4px;
}

.scrub{
  appearance:none;
  width:100%;
  height:2px;
  background:var(--outline-color);
  border-radius:3px;
  outline:none;
  cursor:pointer;
  accent-color:#9a9a9a;
}

.scrub::-webkit-slider-thumb{
  appearance:none;
  width:12px;
  height:12px;
  border-radius:50%;
  background:#9a9a9a;
  cursor:pointer;
}

.scrub::-moz-range-thumb{
  width:12px;
  height:12px;
  border-radius:50%;
  background:#9a9a9a;
  border:none;
}

.controls{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:14px;
  padding:10px 0 14px;
}

.controls button{
  background:none;
  border:none;
  font-size:20px;
  cursor:pointer;
  color:#111;
  padding:4px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:var(--radius-btn);
}

.controls button:hover{
  opacity:.6;
}

.controls .play-btn{
  font-size:19px;
}

.controls .toggle-btn{
  font-size:17px;
  color:#999;
}

.controls .toggle-btn.active{
  color:var(--accent-color);
}

.song-list{
  padding:0 14px 16px;
  display:flex;
  flex-direction:column;
  gap:6px;
  max-height:260px;
  overflow-y:auto;
  scrollbar-width:thin;
}

.song{
  border:1px solid var(--outline-color);
  border-radius:var(--radius-song);
  padding:8px 10px;
  display:flex;
  align-items:center;
  gap:8px;
  background:#fff;
  cursor:pointer;
  position:relative;
  user-select:none;
  touch-action:pan-y;
}

.song.active{
  background:var(--header-color);
}

.song.dragging{
  box-shadow:0 6px 14px rgba(0,0,0,.18);
  opacity:.6;
}

.drag-handle{
  width:14px;
  height:18px;
  position:relative;
  flex-shrink:0;
  cursor:grab;
  touch-action:none;
}

.drag-handle:before{
  content:'';
  position:absolute;
  top:1px;
  left:2px;
  width:3px;
  height:3px;
  border-radius:50%;
  background:#c4c4c4;
  box-shadow:
    0 5px 0 #c4c4c4,
    0 10px 0 #c4c4c4,
    6px 0 0 #c4c4c4,
    6px 5px 0 #c4c4c4,
    6px 10px 0 #c4c4c4;
}

.song .note{
  font-size:15px;
  color:var(--song-title-color);
}

.song-info{
  display:flex;
  flex-direction:column;
  min-width:0;
  text-align:left;
  flex:1;
}

.song-name{
  color:var(--song-title-color);
  font-family:var(--font-family);
  font-size:calc(13px * var(--text-scale));
  font-weight:600;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.artist-name{
  color:var(--artist-color);
  font-family:var(--font-family);
  font-size:calc(11px * var(--text-scale));
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.delete-song{
  display:none;
  border:none;
  background:#222;
  color:#fff;
  width:22px;
  height:22px;
  border-radius:50%;
  font-size:12px;
  cursor:pointer;
  flex-shrink:0;
}

.song.long-pressed .delete-song{
  display:flex;
  align-items:center;
  justify-content:center;
}

.empty-state{
  padding:6px 24px 26px;
  text-align:center;
}

.empty-state .icon{
  font-size:20px;
  color:#ccc;
  display:block;
  margin-bottom:6px;
}

.empty-state p{
  margin:0;
  font-size:12.5px;
  color:#999;
  line-height:1.5;
}

.empty-state button{
  margin-top:10px;
  border:1.5px dashed #ccc;
  background:none;
  color:#666;
  font-size:12px;
  padding:7px 14px;
  border-radius:20px;
  cursor:pointer;
}

.settings-overlay,
.wheel-popover-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.4);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:50;
}

.settings-overlay.open,
.wheel-popover-overlay.open{
  display:flex;
}

.settings-panel{
  background:#fff;
  width:320px;
  max-height:85vh;
  overflow-y:auto;
  border-radius:10px;
  padding:18px;
  font-family:Arial,sans-serif;
  box-shadow:0 14px 36px rgba(0,0,0,.25);
}

.settings-panel h2{
  margin:0 0 12px;
  font-size:16px;
  display:flex;
  justify-content:space-between;
}

.close{
  cursor:pointer;
  border:none;
  background:none;
  color:#888;
}

.setting-group{
  margin-bottom:14px;
}

.setting-group label{
  display:block;
  font-size:11px;
  font-weight:600;
  color:#444;
  margin-bottom:5px;
  text-transform:uppercase;
  letter-spacing:.4px;
}

.setting-group input[type=text],
select{
  width:100%;
  padding:8px 9px;
  border:1px solid #ccc;
  border-radius:5px;
  font-size:13px;
  background:#fff;
}

.range-row{
  display:flex;
  align-items:center;
  gap:8px;
}

.range-row input{
  flex:1;
}

.range-row span{
  font-size:12px;
  color:#666;
  width:45px;
  text-align:right;
}

.import-dropzone{
  border:1.5px dashed #bbb;
  border-radius:6px;
  padding:14px;
  text-align:center;
  cursor:pointer;
  background:#fafafa;
  display:block;
}

.import-dropzone .icon{
  font-size:22px;
  display:block;
  margin-bottom:6px;
}

.import-dropzone .label{
  font-size:13px;
  font-weight:600;
  color:#333;
}

.import-dropzone .sub{
  font-size:11px;
  color:#999;
  margin-top:2px;
}

.import-dropzone input{
  display:none;
}

.color-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px 12px;
}

.color-item{
  display:flex;
  align-items:center;
  gap:8px;
}

.swatch-btn{
  width:30px;
  height:30px;
  border-radius:50%;
  border:2px solid #fff;
  box-shadow:0 0 0 1px #d8d8d8;
  cursor:pointer;
  flex-shrink:0;
}

.color-item-text{
  display:flex;
  flex-direction:column;
  gap:3px;
  min-width:0;
  flex:1;
}

.color-item-label{
  font-size:10px;
  color:#909090;
}

.hex-input{
  width:100%;
  font-family:monospace;
  font-size:11px;
  padding:4px 6px;
  border:1px solid #ddd;
  border-radius:4px;
}

.pattern-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.pattern-tile{
  height:44px;
  border-radius:6px;
  border:1.5px solid #ddd;
  background:#fff;
  cursor:pointer;
  position:relative;
}

.pattern-tile.active{
  border-color:var(--outline-color);
  border-width:2px;
}

#patternGrid{
  background-image:
    linear-gradient(to right,rgba(0,0,0,.16) 1px,transparent 1px),
    linear-gradient(to bottom,rgba(0,0,0,.16) 1px,transparent 1px);
  background-size:9px 9px;
}

#patternDots{
  background-image:radial-gradient(
    rgba(0,0,0,.28) 1.3px,
    transparent 1.3px
  );
  background-size:8px 8px;
}

.pattern-tile-label{
  font-size:9px;
  color:#777;
  background:rgba(255,255,255,.85);
  padding:1px 5px;
  border-radius:3px;
  position:absolute;
  bottom:4px;
  left:50%;
  transform:translateX(-50%);
}

.photo-shape-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
}

.shape-btn{
  padding:8px 3px;
  border:1px solid #ddd;
  border-radius:5px;
  background:#fff;
  font-size:10px;
  cursor:pointer;
}

.shape-btn.active{
  border:2px solid var(--outline-color);
}

.font-preview{
  margin-top:6px;
  border:1px solid #eee;
  border-radius:6px;
  padding:10px 12px;
  background:#fafafa;
}

#fontPreviewSample{
  display:block;
  font-size:20px;
}

#fontPreviewType{
  display:block;
  font-family:Arial,sans-serif;
  font-size:11px;
  color:#999;
  margin-top:6px;
}

.reset-btn{
  width:100%;
  padding:9px;
  background:#222;
  color:#fff;
  border:none;
  border-radius:6px;
  cursor:pointer;
  font-size:13px;
}

hr{
  border:none;
  border-top:1px solid #eee;
  margin:14px 0;
}

.wheel-popover{
  background:#fff;
  border-radius:10px;
  padding:16px;
  width:212px;
  box-shadow:0 14px 36px rgba(0,0,0,.3);
}

.sv-box{
  position:relative;
  width:100%;
  height:130px;
  border-radius:8px;
  cursor:crosshair;
  background-image:
    linear-gradient(to top,#000,transparent),
    linear-gradient(to right,#fff,transparent);
}

.sv-marker{
  position:absolute;
  width:14px;
  height:14px;
  border-radius:50%;
  border:2px solid #fff;
  box-shadow:0 0 0 1px var(--outline-color);
  pointer-events:none;
  transform:translate(-50%,-50%);
}

.hue-slider{
  width:100%;
  margin:10px 0;
  accent-color:#9a9a9a;
}

.wheel-hex-row{
  display:flex;
  align-items:center;
  gap:5px;
  border:1px solid #ddd;
  border-radius:6px;
  padding:7px;
}

.wheel-hex-row input{
  border:none;
  outline:none;
  flex:1;
  font-family:monospace;
}

.song-edit{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.4);
  align-items:center;
  justify-content:center;
  z-index:100;
}

.song-edit.open{
  display:flex;
}

.song-edit-panel{
  background:#fff;
  width:280px;
  padding:18px;
  border-radius:10px;
}

.song-edit-panel h3{
  margin:0 0 12px;
}

.song-edit-panel input{
  width:100%;
  padding:8px;
  margin-bottom:8px;
  border:1px solid #ccc;
  border-radius:5px;
}

.song-edit-panel button{
  width:100%;
  padding:8px;
  border:none;
  border-radius:5px;
  cursor:pointer;
  margin-top:5px;
}

.save-edit{
  background:#222;
  color:#fff;
}

.cancel-edit{
  background:#eee;
}

input[type="range"]{
  accent-color:#9a9a9a;
}
</style>
</head>

<body>

<div class="player" id="player" data-pattern="none" data-corner="curved">

  <div class="header">
    <div class="title" id="titleText" contenteditable="true" spellcheck="false">Title</div>

    <button class="menu-btn" id="menuBtn" title="Settings">&#10022;</button>
  </div>

  <div class="cover" id="cover">
    <span class="cover-icon">&#9835;</span>
    Image
  </div>

  <div id="playbackArea"></div>

  <div class="song-list" id="songList"></div>

  <div class="empty-state" id="emptyState">
    <span class="icon">&#9835;</span>

    <p>
      No songs yet.<br>
      Open settings to add some.
    </p>

    <button id="emptyAddBtn">+ Add songs</button>
  </div>

</div>


<div class="settings-overlay" id="settingsOverlay">

<div class="settings-panel">

<h2>
  Settings
  <button class="close" id="closeSettings">&#10005;</button>
</h2>

<div class="setting-group">

<label>Title</label>

<input
  type="text"
  id="titleInput"
  value="Title"
  maxlength="40"
>

</div>


<div class="setting-group">

<label>Import songs</label>

<label class="import-dropzone">

<span class="icon">&#9835;</span>

<span class="label">
  Click or drop audio files
</span>

<span class="sub">
  Audio files are saved in this browser
</span>

<input
  type="file"
  id="songImport"
  accept="audio/*"
  multiple
>

</label>

</div>


<div class="setting-group">

<label>Import photo</label>

<label class="import-dropzone">

<span class="icon">&#128247;</span>

<span class="label">
  Click or drop an image
</span>

<span class="sub">
  Sets it as the album art
</span>

<input
  type="file"
  id="photoImport"
  accept="image/*"
>

</label>

</div>


<hr>


<div class="setting-group">

<label>Colors</label>

<div class="color-grid">


<div class="color-item">

<button
  class="swatch-btn"
  id="headerColorSwatch"
></button>

<div class="color-item-text">

<span class="color-item-label">
Header bar
</span>

<input
  class="hex-input"
  id="headerColorHex"
  value="#8A8A8A"
>

</div>
</div>


<div class="color-item">

<button
  class="swatch-btn"
  id="titleColorSwatch"
></button>

<div class="color-item-text">

<span class="color-item-label">
Title
</span>

<input
  class="hex-input"
  id="titleColorHex"
  value="#1A1A1A"
>

</div>
</div>


<div class="color-item">

<button
  class="swatch-btn"
  id="songTitleColorSwatch"
></button>

<div class="color-item-text">

<span class="color-item-label">
Song title
</span>

<input
  class="hex-input"
  id="songTitleColorHex"
  value="#1A1A1A"
>

</div>
</div>


<div class="color-item">

<button
  class="swatch-btn"
  id="bgColorSwatch"
></button>

<div class="color-item-text">

<span class="color-item-label">
Background
</span>

<input
  class="hex-input"
  id="bgColorHex"
  value="#FFFFFF"
>

</div>
</div>


<div class="color-item">

<button
  class="swatch-btn"
  id="artistColorSwatch"
></button>

<div class="color-item-text">

<span class="color-item-label">
Artist text
</span>

<input
  class="hex-input"
  id="artistColorHex"
  value="#767676"
>

</div>
</div>


<div class="color-item">

<button
  class="swatch-btn"
  id="outlineColorSwatch"
></button>

<div class="color-item-text">

<span class="color-item-label">
Outline
</span>

<input
  class="hex-input"
  id="outlineColorHex"
  value="#E6E5E3"
>

</div>
</div>


</div>
</div>


<div class="setting-group">

<label>Background pattern</label>

<div class="pattern-grid">

<button
  class="pattern-tile active"
  data-pattern="none"
  id="patternNone"
>
<span class="pattern-tile-label">
None
</span>
</button>

<button
  class="pattern-tile"
  data-pattern="grid"
  id="patternGrid"
>
<span class="pattern-tile-label">
Grid
</span>
</button>

<button
  class="pattern-tile"
  data-pattern="dots"
  id="patternDots"
>
<span class="pattern-tile-label">
Dots
</span>
</button>

</div>


<div class="range-row">

<input
  type="range"
  id="patternOpacityRange"
  min="10"
  max="80"
  value="35"
>

<span id="patternOpacityVal">
35%
</span>

</div>

</div>


<div class="setting-group">

<label>Font</label>

<select id="fontSelect">

<option value="'Montserrat',sans-serif">
Montserrat
</option>

<option value="'Pixelify Sans',sans-serif">
Pixelify Sans
</option>

<option value="'Press Start 2P',monospace">
Press Start 2P
</option>

<option value="'Pathway Gothic One',sans-serif">
Pathway Gothic One
</option>

<option value="'Playfair Display',serif">
Playfair Display
</option>

<option value="'Elsie',serif">
Elsie
</option>

<option value="'Amatic SC',cursive">
Amatic SC
</option>

<option value="'Courgette',cursive">
Courgette
</option>

<option value="'Sue Ellen Francisco',cursive">
Sue Ellen Francisco
</option>

<option value="'Just Another Hand',cursive">
Just Another Hand
</option>

<option value="'Gamja Flower',cursive">
Gamja Flower
</option>

<option value="'Hachi Maru Pop',cursive">
Hachi Maru Pop
</option>

<option value="'Pompiere',cursive">
Pompiere
</option>

<option value="'Schoolbell',cursive">
Schoolbell
</option>

<option value="'Yomogi',cursive">
Yomogi
</option>

</select>


<div class="font-preview">

<span id="fontPreviewSample">
Aa Bb — Song Title
</span>

<span id="fontPreviewType">
Montserrat
</span>

</div>

</div>


<div class="setting-group">

<label>Player size</label>

<div class="range-row">

<input
  type="range"
  id="scaleRange"
  min="60"
  max="150"
  value="100"

/* =========================================================
   UNIQUE WIDGET ID
   ========================================================= */

/*
   IMPORTANT:

   Every iframe gets its own ID.

   We DO NOT use the iframe src anymore because two identical
   embeds normally have the exact same src.

   window.name belongs to the individual iframe and survives
   page reloads much better than a random ID generated every
   time.
*/

function getWidgetId(){

  try{

    if(
      window.name &&
      window.name.startsWith('music_widget_')
    ){
      return window.name;
    }

    const id=
      'music_widget_' +
      Date.now().toString(36) +
      '_' +
      Math.random()
        .toString(36)
        .slice(2,12);

    window.name=id;

    return id;

  }catch(e){

    /*
      Extremely rare fallback.

      This is only used if the browser blocks window.name.
    */

    let fallback=
      localStorage.getItem(
        '__music_widget_fallback_id'
      );

    if(!fallback){

      fallback=
        'music_widget_' +
        Date.now().toString(36) +
        '_' +
        Math.random()
          .toString(36)
          .slice(2,12);

      try{
        localStorage.setItem(
          '__music_widget_fallback_id',
          fallback
        );
      }catch(err){}
    }

    return fallback;
  }
}

const WIDGET_ID=getWidgetId();


function storageKey(base){
  return base+'__'+WIDGET_ID;
}


/* =========================================================
   STATE

/* =========================================================
   INDEXED DB
   ========================================================= */

const DB_NAME='MusicPlayer_Isolated_Audio';
const DB_VERSION=2;
const STORE='audio';

let db=null;


/*
   Open IndexedDB.

   The database itself is shared, but every stored file has
   WIDGET_ID attached to its key.

   Therefore:

   Widget A:
   music_widget_A::song123

   Widget B:
   music_widget_B::song123

   They cannot overwrite each other.
*/

function openDB(){

  return new Promise((resolve,reject)=>{

    if(!window.indexedDB){
      reject(
        new Error('IndexedDB is unavailable')
      );
      return;
    }

    const request=
      indexedDB.open(
        DB_NAME,
        DB_VERSION
      );

    request.onupgradeneeded=e=>{

      const database=e.target.result;

      if(
        !database.objectStoreNames.contains(STORE)
      ){

        database.createObjectStore(
          STORE,
          {
            keyPath:'id'
          }
        );

      }

    };

    request.onsuccess=e=>{

      db=e.target.result;

      db.onversionchange=()=>{
        db.close();
      };

      resolve(db);

    };

    request.onerror=()=>{
      reject(request.error);
    };

  });
}


function scopedAudioId(id){

  return WIDGET_ID+'::'+id;
}


function saveAudioFile(id,file){

  return new Promise((resolve,reject)=>{

    if(!db){
      reject(
        new Error('Audio database is not ready.')
      );
      return;
    }

    try{

      const tx=
        db.transaction(
          STORE,
          'readwrite'
        );

      tx.objectStore(STORE).put({
        id:scopedAudioId(id),
        blob:file
      });

      tx.oncomplete=resolve;

      tx.onerror=()=>{
        reject(tx.error);
      };

      tx.onabort=()=>{
        reject(tx.error);
      };

    }catch(error){

      reject(error);

    }

  });
}


function getAudioFile(id){

  return new Promise((resolve,reject)=>{

    if(!db){
      resolve(null);
      return;
    }

    try{

      const tx=
        db.transaction(
          STORE,
          'readonly'
        );

      const request=
        tx.objectStore(STORE)
          .get(scopedAudioId(id));

      request.onsuccess=()=>{
        resolve(
          request.result
            ?request.result.blob
            :null
        );
      };

      request.onerror=()=>{
        reject(request.error);
      };

    }catch(error){

      reject(error);

    }

  });
}


function deleteAudioFile(id){

  return new Promise(resolve=>{

    if(!db){
      resolve();
      return;
    }

    try{

      const tx=
        db.transaction(
          STORE,
          'readwrite'
        );

      tx.objectStore(STORE)
        .delete(scopedAudioId(id));

      tx.oncomplete=resolve;
      tx.onerror=resolve;
      tx.onabort=resolve;

    }catch(error){

      resolve();

    }

  });
}

/* =========================================================

   ========================================================= */

function normalizeHex(value){

  let v=
    String(value)
      .trim()
      .replace('#','');

  if(
    /^[0-9a-fA-F]{3}$/.test(v)
  ){

    v=
      v
        .split('')
        .map(x=>x+x)
        .join('');

  }

  if(
    /^[0-9a-fA-F]{6}$/.test(v)
  ){

    return '#'+v.toUpperCase();

  }

  return null;
}


const colorConfigs={

  headerColor:{
    vars:['--header-color'],
    label:'Header bar'
  },

  titleColor:{
    vars:['--title-color'],
    label:'Title'
  },

  songTitleColor:{
    vars:[
      '--song-title-color',
      '--accent-color'
    ],
    label:'Song title'
  },

  bgColor:{
    vars:['--bg-color'],
    label:'Background'
  },

  artistColor:{
    vars:['--artist-color'],
    label:'Artist text'
  },

  outlineColor:{
    vars:['--outline-color'],
    label:'Outline'
  }

};


function setColor(id,hex){

  const valid=
    normalizeHex(hex);

  if(!valid)return;

  const cfg=
    colorConfigs[id];

  if(!cfg)return;

  cfg.vars.forEach(variable=>{

    root.style.setProperty(
      variable,
      valid
    );

  });

  const swatch=
    document.getElementById(
      id+'Swatch'
    );

  const input=
    document.getElementById(
      id+'Hex'
    );

  if(swatch){
    swatch.style.background=valid;
  }

  if(input){
    input.value=valid;
  }

}


function getHex(id){

  const input=
    document.getElementById(
      id+'Hex'
    );

  return input
    ?input.value
    :'#000000';

}


Object.keys(colorConfigs)

/* =========================================================
   COLOR WHEEL
   ========================================================= */

function hexToRgb(hex){

  hex=
    hex
      .replace('#','');

  return{

    r:parseInt(
      hex.slice(0,2),
      16
    ),

    g:parseInt(
      hex.slice(2,4),
      16
    ),

    b:parseInt(
      hex.slice(4,6),
      16
    )

  };

}


function rgbToHex(r,g,b){

  return '#'+
    [r,g,b]
      .map(v=>
        Math.round(v)
          .toString(16)
          .padStart(2,'0')
      )
      .join('')
      .toUpperCase();

}


function rgbToHsv(r,g,b){

  r/=255;
  g/=255;
  b/=255;

  const max=
    Math.max(r,g,b);

  const min=
    Math.min(r,g,b);

  const d=
    max-min;

  let h=0;

  if(d){

    if(max===r){

      h=
        ((g-b)/d)%6;

    }else if(max===g){

      h=
        (b-r)/d+2;

    }else{

      h=
        (r-g)/d+4;

    }

    h*=60;

    if(h<0){
      h+=360;
    }

  }

  return{

    h,
    s:max?d/max:0,
    v:max

  };

}


function hsvToRgb(h,s,v){

  const c=v*s;

  const x=
    c*
    (
      1-
      Math.abs(
        (h/60)%2-1
      )
    );

  const m=v-c;

  let r=0;
  let g=0;
  let b=0;

  if(h<60){

    r=c;
    g=x;

  }else if(h<120){

    r=x;
    g=c;

  }else if(h<180){

    g=c;
    b=x;

  }else if(h<240){

    g=x;
    b=c;

  }else if(h<300){

    r=x;
    b=c;

  }else{

    r=c;
    b=x;

  }

  return{

    r:(r+m)*255,
    g:(g+m)*255,
    b:(b+m)*255

  };

}


const wheelOverlay=

    'wheelOverlay'
  );

const svBox=

    'wheelHexInput'
  );


let wheelState={

  id:null,
  h:0,
  s:0,
  v:1

};


function openWheel(id){

  wheelState.id=id;

  const rgb=
    hexToRgb(
      getHex(id)
    );

  const hsv=
    rgbToHsv(
      rgb.r,
      rgb.g,
      rgb.b
    );

  wheelState.h=hsv.h;
  wheelState.s=hsv.s;
  wheelState.v=hsv.v;

  hueSlider.value=
    wheelState.h;

  wheelHex.value=
    getHex(id)
      .replace('#','');

  updateWheel();

  wheelOverlay.classList.add('open');

}


function updateWheel(){

  if(!wheelState.id)return;

  const rgb=
    hsvToRgb(
      wheelState.h,
      1,
      1
    );

  svBox.style.backgroundColor=
    rgbToHex(
      rgb.r,
      rgb.g,
      rgb.b
    );

  svMarker.style.left=
    (wheelState.s*100)+'%';

  svMarker.style.top=
    ((1-wheelState.v)*100)+'%';

  const c=
    hsvToRgb(
      wheelState.h,
      wheelState.s,
      wheelState.v
    );

  const hex=
    rgbToHex(
      c.r,
      c.g,
      c.b
    );

  setColor(
    wheelState.id,
    hex
  );

  wheelHex.value=
    hex.replace('#','');

  saveSettings();

}


function handleSV(e){

  const rect=
    svBox.getBoundingClientRect();

  wheelState.s=
    Math.max(
      0,
      Math.min(
        1,
        (e.clientX-rect.left)/
        rect.width
      )
    );

  wheelState.v=
    Math.max(
      0,
      Math.min(
        1,
        1-
        (
          (e.clientY-rect.top)/
          rect.height
        )
      )
    );

  updateWheel();

}


let svDown=false;


svBox.addEventListener(
  'pointerdown',
  e=>{

    svDown=true;

    svBox.setPointerCapture(
      e.pointerId
    );

    handleSV(e);

  }
);


svBox.addEventListener(
  'pointermove',
  e=>{

    if(svDown){

   ========================================================= */

document.getElementById(
  'photoImport'
).onchange=e=>{

  const file=
    e.target.files[0];

  if(!file)return;

  if(
    !file.type.startsWith('image/')
  ){

    e.target.value='';
    return;

  }

/* =========================================================
   AUDIO METADATA
   ========================================================= */

function formatTime(seconds){

  if(
    !isFinite(seconds) ||
    seconds<0
  ){

    return '0:00';

  }

  const mins=
    Math.floor(
      seconds/60
    );

  const secs=
    Math.floor(
      seconds%60
    );

  return mins+':'+
    String(secs)
      .padStart(2,'0');

}


function getMetadata(file){

  let raw=
    file.name.replace(
      /\.[^/.]+$/,
      ''
    );

  let artist=
    'Unknown artist';

  let name=
    raw;

  /*
     "Artist - Song.mp3"
     becomes:

     Artist
     Song
  */

  if(raw.includes(' - ')){

    const parts=
      raw.split(' - ');

    artist=
      parts.shift()
        .trim();

    name=
      parts
        .join(' - ')
        .trim();

  }

  return{
    name:
      name||'Untitled',
    artist:
      artist||'Unknown artist'
  };

}


/* =========================================================
   AUDIO IMPORT
   ========================================================= */

async function addAudioFile(file){

  if(
    !file ||
    !file.type.startsWith('audio/')
  ){

    return;

  }

  /*
     Make sure IndexedDB is actually ready.
  */

  if(!db){

    try{

      await openDB();

    }catch(error){

      console.error(
        'Audio storage unavailable:',
        error
      );

      alert(
        'This browser does not allow audio storage for this widget. Try opening the widget directly in your browser instead of inside a restricted preview.'
      );

      return;

    }

  }

  const meta=
    getMetadata(file);

  /*
     High-resolution unique ID.

     It is also scoped by WIDGET_ID when stored in IndexedDB.
  */

  const id=
    WIDGET_ID+
    '_' +
    Date.now().toString(36)+
    '_' +
    Math.random()
      .toString(36)
      .slice(2,12);


  try{

    await saveAudioFile(
      id,
      file
    );

    songs.push({

      id,
      name:meta.name,
      artist:meta.artist

    });

    /*
       If this is the first imported song,
       automatically select it.
    */

    if(activeIndex===-1){

      activeIndex=0;

    }

    saveSongs();

    renderSongs();

  }catch(error){

    console.error(
      'Could not import audio:',
      error
    );

    alert(
      'The song could not be saved. Your browser or embed service may be blocking local audio storage.'
    );

  }

}


document.getElementById(
  'songImport'
).onchange=async e=>{

  const files=
    Array.from(
      e.target.files||[]
    );

  if(!files.length)return;

  /*
     Import sequentially so IndexedDB isn't overwhelmed
     by several simultaneous transactions.
  */

  for(
    const file of files
  ){

    await addAudioFile(file);

  }

  /*
     Clearing the input allows the SAME file to be selected
     again later.
  */

  e.target.value='';

};

/* =========================================================
   LOAD ACTIVE SONG
   ========================================================= */

async function loadActiveSong(
  shouldPlay=false
){

  if(
    activeIndex<0 ||
    activeIndex>=songs.length
  ){

    return;

  }

  if(
    !playbackArea.innerHTML.trim()
  ){

    buildPlayback();

  }

  const song=
    songs[activeIndex];

  /*
     Stop previous audio.
  */

  if(audio){

    audio.pause();

    audio.src='';

  }

  /*
     Release previous object URL.
  */

  if(audioURL){

    URL.revokeObjectURL(
      audioURL
    );

    audioURL=null;

  }

  audio=null;


  let blob=null;

  try{

    blob=
      await getAudioFile(
        song.id
      );

  }catch(error){

    console.error(
      'Could not load audio:',
      error
    );

    return;

  }


  if(!blob){

    console.warn(
      'Audio file missing:',
      song.id
    );

    return;

  }


  audioURL=
    URL.createObjectURL(
      blob
    );

  audio=
    new Audio();

  audio.preload='metadata';

  audio.src=
    audioURL;


  audio.addEventListener(
    'loadedmetadata',
    ()=>{

      const total=
        document.getElementById(
          'totalTime'
        );

      if(total){

        total.textContent=
          formatTime(
            audio.duration
          );

      }

    }
  );


  audio.addEventListener(
    'timeupdate',
    ()=>{

      if(!audio)return;

      const cur=
        document.getElementById(
          'curTime'
        );

      const scrub=
        document.getElementById(
          'scrub'
        );

      if(cur){

        cur.textContent=
          formatTime(
            audio.currentTime
          );

      }

      if(
        scrub &&
        audio.duration
      ){

        scrub.value=
          (
            audio.currentTime/
            audio.duration
          )*
          100;

      }

    }
  );


  audio.addEventListener(
    'ended',
    ()=>{

      if(autoPlay){

        stepSong(
          1,
          true
        );

      }else{

        const playBtn=
          document.getElementById(
            'playBtn'
          );

        if(playBtn){

          playBtn.innerHTML=
            '&#9654;';

        }

      }

    }
  );


  audio.addEventListener(
    'error',
    ()=>{
      console.warn(
        'Audio playback error.'
      );
    }
  );


  const playBtn=
    document.getElementById(
      'playBtn'
    );

  if(playBtn){

    playBtn.innerHTML=
      '&#9654;';

  }


  renderSongs();


  if(shouldPlay){

    try{

      await audio.play();

      if(playBtn){

        playBtn.innerHTML=
          '&#10074;&#10074;';

      }

    }catch(error){

      console.warn(
        'Playback was blocked:',
        error
      );

    }

  }

}


/* =========================================================
   PLAY / PAUSE
   ========================================================= */

async function togglePlay(){

  if(!songs.length){

    return;

  }

  if(activeIndex===-1){

    activeIndex=0;

  }

  if(!audio){

    await loadActiveSong(true);

    return;

  }

  if(audio.paused){

    try{

      await audio.play();

      const playBtn=
        document.getElementById(
          'playBtn'
        );

      if(playBtn){

        playBtn.innerHTML=
          '&#10074;&#10074;';

      }

    }catch(error){

      console.warn(
        'Playback failed:',
        error
      );

    }

  }else{

    audio.pause();

    const playBtn=
      document.getElementById(
        'playBtn'
      );

    if(playBtn){

      playBtn.innerHTML=
        '&#9654;';

    }

  }

}


/* =========================================================
   NEXT / PREVIOUS
   ========================================================= */

function stepSong(
  direction,
  playAfter=false
){

  if(!songs.length)return;

  if(
    shuffle &&
    direction>0 &&
    songs.length>1
  ){

    let next;

    do{

      next=
        Math.floor(
          Math.random()*
          songs.length
        );

    }while(
      next===activeIndex
    );

    activeIndex=next;

  }else{

    activeIndex=
      (
        activeIndex+
        direction+
        songs.length
      )%
      songs.length;

  }

  loadActiveSong(
    playAfter
  );

}


/* =========================================================
   DRAG TO REORDER
   ========================================================= */

function startDrag(songId){

  draggedId=songId;

  document.body.style.userSelect=
    'none';

  const el=
    songList.querySelector(
      `[data-song-id="${CSS.escape(songId)}"]`
    );

  if(el){

    el.classList.add(
      'dragging'
    );

  }

}


document.addEventListener(
  'pointermove',
  e=>{

    if(!draggedId)return;

    const target=
      document.elementFromPoint(
        e.clientX,
        e.clientY
      );

    const overEl=
      target &&
      target.closest('.song');

    if(!overEl)return;

    const overId=
      overEl.dataset.songId;

    if(overId===draggedId)return;

    const fromIndex=
      songs.findIndex(
        s=>s.id===draggedId
      );

    const toIndex=
      songs.findIndex(
        s=>s.id===overId
      );

    if(
      fromIndex===-1 ||
      toIndex===-1
    ){

      return;

    }

    const activeSongId=
      activeIndex>=0 &&
      activeIndex<songs.length
        ?songs[activeIndex].id
        :null;


    const moved=
      songs.splice(
        fromIndex,
        1
      )[0];

    songs.splice(
      toIndex,
      0,
      moved
    );


    if(activeSongId){

      activeIndex=
        songs.findIndex(
          s=>
            s.id===
            activeSongId
        );

    }

    renderSongs();


    const newEl=
      songList.querySelector(
        `[data-song-id="${CSS.escape(draggedId)}"]`
      );

    if(newEl){

      newEl.classList.add(
        'dragging'
      );

    }

  }
);


document.addEventListener(
  'pointerup',
  ()=>{

    if(!draggedId)return;

    draggedId=null;

    document.body.style.userSelect=
      '';

    saveSongs();

    renderSongs();

  }
);


document.addEventListener(
  'pointercancel',
  ()=>{

    if(!draggedId)return;

    draggedId=null;

    document.body.style.userSelect=
      '';

    renderSongs();

  }
);


/* =========================================================
   SONG LIST
   ========================================================= */

function renderSongs(){

  const hasSongs=
    songs.length>0;


  emptyState.style.display=
    hasSongs
      ?'none'
      :'block';


  songList.style.display=
    hasSongs
      ?'flex'
      :'none';


  playbackArea.style.display=
    hasSongs
      ?'block'
      :'none';


  if(!hasSongs){

    return;

  }


  if(
    !playbackArea.innerHTML.trim()
  ){

    buildPlayback();

  }


  songList.innerHTML='';


  songs.forEach(
    (song,index)=>{

      const div=
        document.createElement(
          'div'
        );

      div.className=
        'song'+
        (
          index===activeIndex
            ?' active'
            :''
        );

      div.dataset.songId=
        song.id;


      div.innerHTML=`

        <span class="drag-handle"></span>

        <span class="note">
          &#9835;
        </span>

        <div class="song-info">

          <span class="song-name"></span>

          <span class="artist-name"></span>

        </div>

        <button
          class="delete-song"
          title="Delete"
        >
          &#10005;
        </button>
      `;


      div.querySelector(
        '.song-name'
      ).textContent=
        song.name;


      div.querySelector(
        '.artist-name'
      ).textContent=
        song.artist;


      let pressTimer=null;


      div.addEventListener(
        'pointerdown',
        e=>{

          if(
            e.target.closest(
              '.delete-song'
            )
          ){

            return;

          }

          if(
            e.target.closest(
              '.drag-handle'
            )
          ){

            return;

          }


          pressTimer=
            setTimeout(
              ()=>{

                div.classList.add(
                  'long-pressed'
                );

              },
              600
            );

        }
      );


      div.querySelector(
        '.drag-handle'
      ).addEventListener(
        'pointerdown',
        e=>{

          e.preventDefault();
          e.stopPropagation();

          startDrag(
            song.id
          );

        }
      );


      div.addEventListener(
        'pointerup',
        ()=>{

          if(pressTimer){

            clearTimeout(
              pressTimer
            );

            pressTimer=null;

          }

        }
      );


      div.addEventListener(
        'pointercancel',
        ()=>{

          if(pressTimer){

            clearTimeout(
              pressTimer
            );

            pressTimer=null;

          }

        }
      );


      div.querySelector(
        '.delete-song'
      ).onclick=async e=>{

        e.stopPropagation();

        await deleteSong(
          index
        );

      };


      div.addEventListener(
        'dblclick',
        e=>{

          if(
            e.target.closest(
              '.delete-song'
            )
          ){

            return;

          }

          openSongEditor(
            index
          );

        }
      );


      div.onclick=async e=>{

        if(
          e.target.closest(
            '.delete-song'
          )
        ){

          return;

        }

        if(
          e.target.closest(
            '.drag-handle'
          )
        ){

          return;

        }

        if(
          div.classList.contains(
            'long-pressed'
          )
        ){

          div.classList.remove(
            'long-pressed'
          );

          return;

        }


        activeIndex=index;

        await loadActiveSong(
          false
        );

      };


      songList.appendChild(
        div
      );

    }
  );

}


/* =========================================================
   DELETE SONG
   ========================================================= */

async function deleteSong(index){

  if(
    index<0 ||
    index>=songs.length
  ){

    return;

  }


  const id=
    songs[index].id;


  /*
     If deleting the currently playing song,
     stop the player first.
  */

  const wasActive=
    index===activeIndex;


  await deleteAudioFile(
    id
  );


  songs.splice(
    index,
    1
  );


  if(!songs.length){

    activeIndex=-1;

    if(audio){

      audio.pause();

      audio.src='';

      audio=null;

    }

    if(audioURL){

      URL.revokeObjectURL(
        audioURL
      );

      audioURL=null;

    }

    playbackArea.innerHTML='';


  }else{

    if(
      activeIndex>=songs.length
    ){

      activeIndex=
        songs.length-1;

    }

    if(
      index<activeIndex
    ){

      activeIndex--;

    }

    if(wasActive){

      audio=null;

      if(audioURL){

        URL.revokeObjectURL(
          audioURL
        );

        audioURL=null;

      }

      loadActiveSong(
        false
      );

    }

  }


  saveSongs();

  renderSongs();

}

  songEdit.classList.remove(
    'open'
  );

  editingIndex=-1;

};


songEdit.onclick=e=>{

  if(e.target===songEdit){

    songEdit.classList.remove(
      'open'
    );

    editingIndex=-1;

  }

};


/* =========================================================
   RESET SETTINGS
   ========================================================= */

document.getElementById(
  'resetBtn'
).onclick=()=>{

  /*
     IMPORTANT:
     Reset does NOT delete songs.

     It only resets this widget's visual/settings state.
  */


  setColor(
    'headerColor',
    '#8A8A8A'
  );

  setColor(
    'titleColor',
    '#1A1A1A'
  );

  setColor(
    'songTitleColor',
    '#1A1A1A'
  );

  setColor(
    'bgColor',
    '#FFFFFF'
  );

  setColor(
    'artistColor',
    '#767676'
  );

  setColor(
    'outlineColor',
    '#E6E5E3'
  );


  player.dataset.pattern=
    'none';


  patternTiles.forEach(t=>{

    t.classList.toggle(
      'active',
      t.dataset.pattern==='none'
    );

  });


  patternOpacityRange.value=35;

  patternOpacityVal.textContent=
    '35%';

  root.style.setProperty(
    '--pattern-opacity',
    .35
  );


  fontSelect.value=
    "'Montserrat',sans-serif";


  root.style.setProperty(
    '--font-family',
    fontSelect.value
  );


  fontPreviewSample.style.fontFamily=
    fontSelect.value;

  fontPreviewType.textContent=
    'Montserrat';


  scaleRange.value=100;

  root.style.setProperty(
    '--scale',
    1
  );

  scaleVal.textContent=
    '100%';


  textScaleRange.value=100;

  root.style.setProperty(
    '--text-scale',
    1
  );

  textScaleVal.textContent=
    '100%';


  photoSizeRange.value=190;

  setPhotoSize(190);


  setPhotoShape(
    'square'
  );


  setCornerStyle(
    'curved'
  );


  titleText.textContent=
    'Title';

  titleInput.value=
    'Title';


  shuffle=false;
  autoPlay=false;


  /*
     Reset photo as well.
  */

  try{

    localStorage.removeItem(
      storageKey(
        'musicPlayerPhoto'
      )
    );

  }catch(error){}


  cover.innerHTML=`
    <span class="cover-icon">
      &#9835;
    </span>
    Image
  `;


  saveSettings();


  if(
    playbackArea.innerHTML.trim()
  ){

    const shuffleBtn=
      document.getElementById(
        'shuffleBtn'
      );

    const autoBtn=
      document.getElementById(
        'autoBtn'
      );

    if(shuffleBtn){

      shuffleBtn.classList.remove(
        'active'
      );

    }

    if(autoBtn){

      autoBtn.classList.remove(
        'active'
      );

    }

  }

};


/* =========================================================
   LOAD SAVED PHOTO
   ========================================================= */

function loadSavedPhoto(){

  try{

    const savedPhoto=
      localStorage.getItem(
        storageKey(
          'musicPlayerPhoto'
        )
      );

    if(!savedPhoto)return;

    cover.innerHTML='';

    const img=
      document.createElement(
        'img'
      );

    img.src=
      savedPhoto;

    cover.appendChild(
      img
    );

  }catch(error){

    console.warn(
      'Could not load saved photo:',
      error
    );

  }

}


/* =========================================================
   INITIALIZE
   ========================================================= */

async function init(){

  /*
     Open database BEFORE loading/importing songs.
  */

  try{

    await openDB();

  }catch(error){

    console.warn(
      'IndexedDB unavailable:',
      error
    );

  }


  /*
     Load this iframe's songs/settings only.
  */

  loadSongs();

  loadSettings();

  loadSavedPhoto();


  /*
     If the active index was invalid because the song list
     changed, correct it.
  */

  if(
    songs.length &&
    (
      activeIndex<0 ||
      activeIndex>=songs.length
    )
  ){

    activeIndex=0;

  }


  renderSongs();

}


init();


/* =========================================================
   CLEANUP
   ========================================================= */

window.addEventListener(
  'beforeunload',
  ()=>{

    if(audio){

      audio.pause();

    }

    if(audioURL){

      URL.revokeObjectURL(
        audioURL
      );

    }

  }
);

</script>
