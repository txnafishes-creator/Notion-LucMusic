<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Music Player</title>

<link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&family=Courgette&family=Elsie:wght@400;900&family=Gamja+Flower&family=Hachi+Maru+Pop&family=Just+Another+Hand&family=Montserrat:wght@400;500;600;700&family=Pathway+Gothic+One&family=Pixelify+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&family=Pompiere&family=Press+Start+2P&family=Schoolbell&family=Sue+Ellen+Francisco&family=Yomogi&display=swap" rel="stylesheet">

<style>
:root{
  --header-color:#8a8a8a;
  --title-color:#1a1a1a;
  --song-title-color:#1a1a1a;
  --artist-color:#767676;
  --bg-color:#ffffff;
  --font-family:'Montserrat',sans-serif;
  --scale:1;
  --text-scale:1;
  --pattern-opacity:.35;
  --accent-color:#1a1a1a;
  --cover-size:170px;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:transparent!important;
}

body{
  display:flex;
  align-items:flex-start;
  justify-content:center;
  padding:4px;
  overflow:hidden;
  font-family:Arial,sans-serif;
}

.player{
  width:290px;
  transform:scale(var(--scale));
  transform-origin:top center;
  background:var(--bg-color);
  background-image:none;
  border:1px solid #222;
  border-radius:8px;
  overflow:hidden;
  box-shadow:0 6px 18px rgba(0,0,0,.1);
  position:relative;
}

.player[data-pattern="grid"]{
  background-image:
    linear-gradient(to right,rgba(120,120,120,var(--pattern-opacity)) 1px,transparent 1px),
    linear-gradient(to bottom,rgba(120,120,120,var(--pattern-opacity)) 1px,transparent 1px);
  background-size:20px 20px;
}

.player[data-pattern="dots"]{
  background-image:
    radial-gradient(rgba(120,120,120,var(--pattern-opacity)) 1.4px,transparent 1.4px);
  background-size:16px 16px;
}

.header{
  background:var(--header-color);
  padding:12px 14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  border-bottom:1px solid #222;
}

.header .title{
  color:var(--title-color);
  font-family:var(--font-family);
  font-weight:600;
  font-size:calc(16px * var(--text-scale));
  letter-spacing:.3px;
  outline:none;
  border-radius:4px;
  padding:2px 6px;
  margin:-2px -6px;
  cursor:text;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  flex:1;
  min-width:0;
}

.header .title:hover{background:rgba(255,255,255,.25)}
.header .title:focus{background:rgba(255,255,255,.4)}

.menu-btn{
  width:26px;
  height:26px;
  background:#fff;
  border:1px solid #222;
  border-radius:5px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  font-size:14px;
  line-height:1;
  user-select:none;
  flex-shrink:0;
}

.menu-btn:hover{
  background:#f0f0f0;
  transform:rotate(45deg);
}

/* COVER */

.cover{
  margin:16px auto 8px;
  width:var(--cover-size);
  height:var(--cover-size);
  border:1px solid #222;
  border-radius:6px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#aaa;
  font-size:13px;
  overflow:hidden;
  background:#fafafa;
  flex-direction:column;
  gap:6px;
  transition:border-radius .2s,clip-path .2s,width .15s,height .15s;
}

.cover.square{border-radius:0}
.cover.rounded{border-radius:10px}
.cover.circle{border-radius:50%}

.cover.heart{
  border:none;
  clip-path:polygon(
    50% 100%,
    8% 57%,
    0% 39%,
    2% 25%,
    10% 12%,
    23% 5%,
    36% 7%,
    50% 20%,
    64% 7%,
    77% 5%,
    90% 12%,
    98% 25%,
    100% 39%,
    92% 57%
  );
}

.cover .cover-icon{
  font-size:26px;
  opacity:.5;
}

.cover img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

/* PLAYBACK */

.scrub-wrap{
  padding:0 18px;
  margin-top:4px;
}

.time-row{
  display:flex;
  justify-content:space-between;
  font-size:12px;
  color:#333;
  margin-bottom:4px;
}

.scrub{
  -webkit-appearance:none;
  appearance:none;
  width:100%;
  height:2px;
  background:#222;
  border-radius:3px;
  outline:none;
  cursor:pointer;
}

.scrub::-webkit-slider-thumb{
  -webkit-appearance:none;
  width:12px;
  height:12px;
  border-radius:50%;
  background:var(--accent-color);
  cursor:pointer;
  margin-top:-5px;
}

.scrub::-moz-range-thumb{
  width:12px;
  height:12px;
  border-radius:50%;
  background:var(--accent-color);
  border:none;
  cursor:pointer;
}

.controls{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:14px;
  padding:10px 0 14px;
}

.controls button{
  background:none;
  border:none;
  font-size:20px;
  cursor:pointer;
  color:#111;
  padding:4px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:6px;
}

.controls button:hover{opacity:.6}

.controls .play-btn{font-size:24px}
.controls .toggle-btn{
  font-size:18px;
  color:#999;
  font-weight:600;
}

.controls .toggle-btn.active{color:var(--accent-color)}

/* SONG LIST */

.song-list{
  padding:0 14px 16px;
  display:flex;
  flex-direction:column;
  gap:6px;
  max-height:260px;
  overflow-y:auto;
  scrollbar-width:thin;
  scrollbar-color:#d0d0d0 transparent;
}

.song-list::-webkit-scrollbar{width:6px}
.song-list::-webkit-scrollbar-track{background:transparent}
.song-list::-webkit-scrollbar-thumb{
  background:#d0d0d0;
  border-radius:3px;
}

.song{
  border:1px solid #222;
  border-radius:5px;
  padding:8px 10px;
  display:flex;
  align-items:center;
  gap:8px;
  background:#fff;
  cursor:pointer;
  position:relative;
  user-select:none;
  touch-action:pan-y;
}

.song.active{background:var(--header-color)}

.song.dragging{
  z-index:5;
  box-shadow:0 6px 14px rgba(0,0,0,.18);
  cursor:grabbing;
}

.drag-handle{
  width:14px;
  height:18px;
  position:relative;
  flex-shrink:0;
}

.drag-handle::before{
  content:'';
  position:absolute;
  top:1px;
  left:2px;
  width:3px;
  height:3px;
  border-radius:50%;
  background:#c4c4c4;
  box-shadow:
    0 5px 0 #c4c4c4,
    0 10px 0 #c4c4c4,
    6px 0 0 #c4c4c4,
    6px 5px 0 #c4c4c4,
    6px 10px 0 #c4c4c4;
}

.song .note{
  font-size:15px;
  color:var(--song-title-color);
  flex-shrink:0;
}

.song-info{
  display:flex;
  flex-direction:column;
  min-width:0;
  text-align:left;
}

.song-name{
  color:var(--song-title-color);
  font-family:var(--font-family);
  font-size:calc(13px * var(--text-scale));
  font-weight:600;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.artist-name{
  color:var(--artist-color);
  font-family:var(--font-family);
  font-size:calc(11px * var(--text-scale));
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.delete-song{
  margin-left:auto;
  width:22px;
  height:22px;
  border:1px solid #222;
  border-radius:50%;
  background:#fff;
  color:#222;
  display:none;
  align-items:center;
  justify-content:center;
  font-size:13px;
  flex-shrink:0;
  cursor:pointer;
}

.song.delete-mode .delete-song{
  display:flex;
}

.empty-state{
  padding:6px 24px 26px;
  text-align:center;
}

.empty-state .icon{
  font-size:20px;
  color:#ccc;
  display:block;
  margin-bottom:6px;
}

.empty-state p{
  margin:0;
  font-size:12.5px;
  color:#999;
  line-height:1.5;
}

.empty-state button{
  margin-top:10px;
  border:1.5px dashed #ccc;
  background:none;
  color:#666;
  font-size:12px;
  padding:7px 14px;
  border-radius:20px;
  cursor:pointer;
}

/* SETTINGS */

.settings-overlay,
.wheel-popover-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.35);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:50;
}

.settings-overlay.open,
.wheel-popover-overlay.open{
  display:flex;
}

.settings-panel{
  background:#fff;
  width:320px;
  max-height:85vh;
  overflow-y:auto;
  border-radius:10px;
  padding:18px;
  font-family:Arial,sans-serif;
  box-shadow:0 14px 36px rgba(0,0,0,.25);
}

.settings-panel h2{
  margin:0 0 12px;
  font-size:16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.settings-panel h2 .close{
  cursor:pointer;
  font-size:16px;
  color:#888;
  background:none;
  border:none;
}

.setting-group{margin-bottom:14px}

.setting-group label{
  display:block;
  font-size:11px;
  font-weight:600;
  color:#444;
  margin-bottom:5px;
  text-transform:uppercase;
  letter-spacing:.4px;
}

.setting-group input[type="text"]{
  width:100%;
  padding:8px 9px;
  border:1px solid #ccc;
  border-radius:5px;
  font-size:13px;
}

.setting-group select,
.setting-group input[type="range"]{width:100%}

.range-row{
  display:flex;
  align-items:center;
  gap:8px;
}

.range-row span{
  font-size:12px;
  color:#666;
  width:45px;
  text-align:right;
}

.settings-panel input[type="range"]{
  accent-color:#8a8a8a;
}

select{
  padding:7px 9px;
  border-radius:5px;
  border:1px solid #ccc;
  font-size:13px;
  background:#fff;
}

/* COLORS */

.color-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px 12px;
}

.color-item{
  display:flex;
  align-items:center;
  gap:8px;
  min-width:0;
}

.swatch-btn{
  width:30px;
  height:30px;
  border-radius:50%;
  border:2px solid #fff;
  box-shadow:0 0 0 1px #d8d8d8;
  cursor:pointer;
  flex-shrink:0;
}

.color-item-text{
  display:flex;
  flex-direction:column;
  gap:3px;
  min-width:0;
  flex:1;
}

.color-item-label{
  font-size:10px;
  color:#909090;
  white-space:nowrap;
}

.hex-input{
  width:100%;
  font-family:monospace;
  font-size:11.5px;
  padding:4px 6px;
  border:1px solid #ddd;
  border-radius:4px;
  text-transform:uppercase;
}

/* PATTERNS */

.pattern-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.pattern-tile{
  height:44px;
  border-radius:6px;
  border:1.5px solid #ddd;
  background-color:#fff;
  cursor:pointer;
  position:relative;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  padding-bottom:4px;
}

.pattern-tile.active{
  border-color:#1a1a1a;
  border-width:2px;
}

.pattern-tile-label{
  font-size:9px;
  color:#777;
  background:rgba(255,255,255,.85);
  padding:1px 5px;
  border-radius:3px;
}

#patternGrid{
  background-image:
    linear-gradient(to right,rgba(0,0,0,.16) 1px,transparent 1px),
    linear-gradient(to bottom,rgba(0,0,0,.16) 1px,transparent 1px);
  background-size:9px 9px;
}

#patternDots{
  background-image:radial-gradient(rgba(0,0,0,.28) 1.3px,transparent 1.3px);
  background-size:8px 8px;
}

.pattern-opacity-row{
  margin-top:10px;
  display:none;
}

.pattern-opacity-row.visible{display:flex}

/* PHOTO SHAPES */

.shape-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
}

.shape-btn{
  height:58px;
  border:1.5px solid #ddd;
  background:#fff;
  border-radius:7px;
  cursor:pointer;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
}

.shape-btn:hover{background:#f7f7f7}

.shape-btn.active{
  border:2px solid #222;
}

.shape-preview{
  width:27px;
  height:27px;
  background:#aaa;
}

.shape-preview.square{border-radius:0}
.shape-preview.rounded{border-radius:7px}
.shape-preview.circle{border-radius:50%}

.shape-preview.heart{
  clip-path:polygon(
    50% 100%,
    8% 57%,
    0% 39%,
    2% 25%,
    10% 12%,
    23% 5%,
    36% 7%,
    50% 20%,
    64% 7%,
    77% 5%,
    90% 12%,
    98% 25%,
    100% 39%,
    92% 57%
  );
}

.shape-btn span:last-child{
  font-size:9px;
  color:#777;
}

/* FONT */

.font-preview{
  margin-top:6px;
  border:1px solid #eee;
  border-radius:6px;
  padding:10px 12px;
  background:#fafafa;
}

#fontPreviewSample{
  display:block;
  font-size:20px;
  color:#1a1a1a;
}

#fontPreviewType{
  display:block;
  font-family:Arial,sans-serif;
  font-size:11px;
  color:#999;
  margin-top:6px;
}

/* IMPORT */

.import-dropzone{
  border:1.5px dashed #bbb;
  border-radius:6px;
  padding:14px;
  text-align:center;
  cursor:pointer;
  background:#fafafa;
  display:block;
}

.import-dropzone .icon{
  font-size:22px;
  display:block;
  margin-bottom:6px;
}

.import-dropzone .label{
  font-size:13px;
  font-weight:600;
  color:#333;
}

.import-dropzone .sub{
  font-size:11px;
  color:#999;
  margin-top:2px;
}

.import-dropzone input[type="file"]{display:none}

.reset-btn{
  width:100%;
  padding:9px;
  background:#222;
  color:#fff;
  border:none;
  border-radius:6px;
  cursor:pointer;
  font-size:13px;
}

hr{
  border:none;
  border-top:1px solid #eee;
  margin:14px 0;
}

/* COLOR WHEEL */

.wheel-popover{
  background:#fff;
  border-radius:10px;
  padding:16px;
  width:212px;
  box-shadow:0 14px 36px rgba(0,0,0,.3);
  font-family:Arial,sans-serif;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:12px;
}

.wheel-popover-header{
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:12.5px;
  font-weight:600;
}

.wheel-popover-header .close{
  cursor:pointer;
  font-size:14px;
  color:#888;
  background:none;
  border:none;
}

.sv-box{
  position:relative;
  width:100%;
  height:130px;
  border-radius:8px;
  cursor:crosshair;
  touch-action:none;
  box-shadow:0 0 0 1px #222;
  background-image:
    linear-gradient(to top,#000,rgba(0,0,0,0)),
    linear-gradient(to right,#fff,rgba(255,255,255,0));
}

.sv-marker{
  position:absolute;
  width:14px;
  height:14px;
  border-radius:50%;
  border:2px solid #fff;
  box-shadow:0 0 0 1px rgba(0,0,0,.5);
  pointer-events:none;
  transform:translate(-50%,-50%);
}

.hue-slider{
  width:100%;
  height:14px;
  border-radius:7px;
  outline:none;
  cursor:pointer;
  background:linear-gradient(
    to right,
    #ff0000 0%,#ffff00 17%,#00ff00 33%,
    #00ffff 50%,#0000ff 67%,#ff00ff 83%,#ff0000 100%
  );
}

.wheel-hex-row{
  width:100%;
  display:flex;
  align-items:center;
  gap:6px;
  border:1px solid #ddd;
  border-radius:6px;
  padding:7px 10px;
  background:#fafafa;
}

.wheel-hex-row input{
  border:none;
  outline:none;
  background:none;
  font-family:monospace;
  font-size:13px;
  text-transform:uppercase;
  flex:1;
  min-width:0;
}
</style>
</head>

<body>

<div class="player" id="player" data-pattern="none">

  <div class="header">
    <div class="title" id="titleText"
      contenteditable="true"
      spellcheck="false">Title</div>

    <button class="menu-btn" id="menuBtn" title="Settings">&#10022;</button>
  </div>

  <div class="cover rounded" id="cover">
    <span class="cover-icon">&#9835;</span>
    Image
  </div>

  <div id="playbackArea"></div>

  <div class="song-list" id="songList"></div>

  <div class="empty-state" id="emptyState">
    <span class="icon">&#9835;</span>
    <p>No songs yet.<br>Open settings to add some.</p>
    <button id="emptyAddBtn">+ Add songs</button>
  </div>

</div>

<div class="settings-overlay" id="settingsOverlay">

  <div class="settings-panel">

    <h2>
      Settings
      <button class="close" id="closeSettings">&#10005;</button>
    </h2>

    <div class="setting-group">
      <label>Title</label>
      <input type="text" id="titleInput" value="Title" maxlength="40">
    </div>

    <div class="setting-group">
      <label>Import songs</label>

      <label class="import-dropzone">
        <span class="icon">&#9835;</span>
        <span class="label">Click or drop audio files</span>
        <span class="sub">Adds each one to the list</span>

        <input
          type="file"
          id="songImport"
          accept="audio/*"
          multiple>
      </label>
    </div>

    <div class="setting-group">
      <label>Import photo</label>

      <label class="import-dropzone">
        <span class="icon">&#128247;</span>
        <span class="label">Click or drop an image</span>
        <span class="sub">Sets it as the album art</span>

        <input
          type="file"
          id="photoImport"
          accept="image/*">
      </label>
    </div>

    <hr>

    <div class="setting-group">
      <label>Photo shape</label>

      <div class="shape-grid">

        <button class="shape-btn" data-shape="square">
          <span class="shape-preview square"></span>
          <span>Square</span>
        </button>

        <button class="shape-btn active" data-shape="rounded">
          <span class="shape-preview rounded"></span>
          <span>Round</span>
        </button>

        <button class="shape-btn" data-shape="circle">
          <span class="shape-preview circle"></span>
          <span>Circle</span>
        </button>

        <button class="shape-btn" data-shape="heart">
          <span class="shape-preview heart"></span>
          <span>Heart</span>
        </button>

      </div>
    </div>

    <div class="setting-group">
      <label>Photo size</label>

      <div class="range-row">
        <input
          type="range"
          id="coverSizeRange"
          min="120"
          max="210"
          value="170">

        <span id="coverSizeVal">170px</span>
      </div>
    </div>

    <hr>

    <div class="setting-group">
      <label>Colors</label>

      <div class="color-grid">

        <div class="color-item">
          <button class="swatch-btn"
            id="headerColorSwatch"
            style="background:#8a8a8a"></button>

          <div class="color-item-text">
            <span class="color-item-label">Header bar</span>
            <input class="hex-input"
              id="headerColorHex"
              value="#8A8A8A">
          </div>
        </div>

        <div class="color-item">
          <button class="swatch-btn"
            id="titleColorSwatch"
            style="background:#1a1a1a"></button>

          <div class="color-item-text">
            <span class="color-item-label">Title</span>
            <input class="hex-input"
              id="titleColorHex"
              value="#1A1A1A">
          </div>
        </div>

        <div class="color-item">
          <button class="swatch-btn"
            id="songTitleColorSwatch"
            style="background:#1a1a1a"></button>

          <div class="color-item-text">
            <span class="color-item-label">Song title</span>
            <input class="hex-input"
              id="songTitleColorHex"
              value="#1A1A1A">
          </div>
        </div>

        <div class="color-item">
          <button class="swatch-btn"
            id="bgColorSwatch"
            style="background:#ffffff"></button>

          <div class="color-item-text">
            <span class="color-item-label">Background</span>
            <input class="hex-input"
              id="bgColorHex"
              value="#FFFFFF">
          </div>
        </div>

      </div>
    </div>

    <div class="setting-group">

      <label>Background pattern</label>

      <div class="pattern-grid">

        <button class="pattern-tile active"
          data-pattern="none">
          <span class="pattern-tile-label">None</span>
        </button>

        <button class="pattern-tile"
          data-pattern="grid"
          id="patternGrid">
          <span class="pattern-tile-label">Grid</span>
        </button>

        <button class="pattern-tile"
          data-pattern="dots"
          id="patternDots">

/* =========================

function hexToRgb(hex){

  hex=hex.replace('#','');

  if(hex.length===3){
    hex=hex.split('').map(c=>c+c).join('');
  }

  const num=parseInt(hex,16);

  return{
    r:(num>>16)&255,
    g:(num>>8)&255,
    b:num&255
  };
}

function rgbToHex(r,g,b){

  return '#'+[r,g,b]
    .map(x=>
      Math.max(0,Math.min(255,Math.round(x)))
      .toString(16)
      .padStart(2,'0')
    )
    .join('');
}

function rgbToHsv(r,g,b){

  r/=255;
  g/=255;
  b/=255;

  const max=Math.max(r,g,b);
  const min=Math.min(r,g,b);
  const d=max-min;

  let h=0;

  if(d!==0){

    if(max===r)h=((g-b)/d)%6;
    else if(max===g)h=(b-r)/d+2;
    else h=(r-g)/d+4;

    h*=60;

    if(h<0)h+=360;
  }

  const s=max===0?0:d/max;
  const v=max;

  return{h,s,v};
}

function hsvToRgb(h,s,v){

  const c=v*s;
  const x=c*(1-Math.abs(((h/60)%2)-1));
  const m=v-c;

  let r=0,g=0,b=0;

  if(h<60){r=c;g=x}
  else if(h<120){r=x;g=c}
  else if(h<180){g=c;b=x}
  else if(h<240){g=x;b=c}
  else if(h<300){r=x;b=c}
  else{r=c;b=x}

  return{
    r:(r+m)*255,
    g:(g+m)*255,
    b:(b+m)*255
  };
}

function normalizeHex(val){

  let v=val.trim().replace('#','');

  if(/^[0-9A-Fa-f]{3}$/.test(v)){
    v=v.split('').map(c=>c+c).join('');
  }

  if(/^[0-9A-Fa-f]{6}$/.test(v)){
    return '#'+v.toUpperCase();
  }

  return null;
}

/* =========================

const wheelOverlay=

const svBox=

const wheelPopoverTitle=
  document.getElementById('wheelPopoverTitle');

const wheelState={
  h:0,
  s:0,
  v:1,
  activeId:null
};

function openWheel(id){

  wheelState.activeId=id;

  wheelPopoverTitle.textContent=
    colorConfigs[id].label;

  const currentHex=
    document.getElementById(id+'Hex').value||'#000000';

  const {r,g,b}=hexToRgb(currentHex);

  const hsv=rgbToHsv(r,g,b);

  wheelState.h=hsv.h;
  wheelState.s=hsv.s;
  wheelState.v=hsv.v||1;

  hueSlider.value=Math.round(wheelState.h);

  wheelHexInput.value=
    currentHex.replace('#','').toUpperCase();

  updateSvBoxHue();
  updateSvMarker();

  wheelOverlay.classList.add('open');
}

function updateSvBoxHue(){

  const rgb=hsvToRgb(
    wheelState.h,
    1,
    1
  );

  svBox.style.backgroundColor=
    rgbToHex(rgb.r,rgb.g,rgb.b);
}

function updateSvMarker(){

  svMarker.style.left=
    wheelState.s*100+'%';

  svMarker.style.top=
    (1-wheelState.v)*100+'%';
}

function applyWheelColor(){

  const rgb=hsvToRgb(
    wheelState.h,
    wheelState.s,
    wheelState.v
  );

  const hex=rgbToHex(
    rgb.r,
    rgb.g,
    rgb.b
  );

  wheelHexInput.value=
    hex.replace('#','').toUpperCase();

  setColor(
    wheelState.activeId,
    hex
  );
}

let svDragging=false;

function handleSvPointer(e){

  const rect=svBox.getBoundingClientRect();

  let x=(e.clientX-rect.left)/rect.width;
  let y=(e.clientY-rect.top)/rect.height;

  x=Math.max(0,Math.min(1,x));
  y=Math.max(0,Math.min(1,y));

  wheelState.s=x;
  wheelState.v=1-y;

  updateSvMarker();
  applyWheelColor();
}

svBox.addEventListener('pointerdown',e=>{
  svDragging=true;
  svBox.setPointerCapture(e.pointerId);
  handleSvPointer(e);
});

svBox.addEventListener('pointermove',e=>{
  if(svDragging)handleSvPointer(e);
});

svBox.addEventListener('pointerup',()=>{
  svDragging=false;
});

hueSlider.addEventListener('input',e=>{

  wheelState.h=parseFloat(e.target.value);

  updateSvBoxHue();

});

/* =========================
   INDEXEDDB
   SAVES ACTUAL AUDIO FILES
========================= */

const DB_NAME='musicPlayerDB';
const DB_VERSION=1;
const STORE='songs';

let db=null;

function openDB(){

  return new Promise((resolve,reject)=>{

    const request=
      indexedDB.open(DB_NAME,DB_VERSION);

    request.onupgradeneeded=e=>{

      const database=e.target.result;

      if(!database.objectStoreNames.contains(STORE)){
        database.createObjectStore(
          STORE,
          {keyPath:'id'}
        );
      }

    };

    request.onsuccess=e=>{
      db=e.target.result;
      resolve(db);
    };

    request.onerror=()=>{
      reject(request.error);
    };

  });

}

function saveSong(song){

  return new Promise((resolve,reject)=>{

    const transaction=
      db.transaction(STORE,'readwrite');

    transaction.objectStore(STORE)
      .put(song);

    transaction.oncomplete=resolve;
    transaction.onerror=()=>{
      reject(transaction.error);
    };

  });

}

function deleteSavedSong(id){

  return new Promise(resolve=>{

    const transaction=
      db.transaction(STORE,'readwrite');

    transaction.objectStore(STORE)
      .delete(id);

    transaction.oncomplete=resolve;

  });

}

function loadSavedSongs(){

  return new Promise((resolve,reject)=>{

    const transaction=
      db.transaction(STORE,'readonly');

    const request=
      transaction.objectStore(STORE).getAll();

    request.onsuccess=()=>{
      resolve(request.result||[]);
    };

    request.onerror=()=>{
      reject(request.error);
    };

  });

}

/* =========================
   AUDIO PLAYER
========================= */

function formatTime(seconds){

  if(!Number.isFinite(seconds)){
    return '0:00';
  }

  seconds=Math.floor(seconds);

  const minutes=Math.floor(seconds/60);

  const secs=String(
    seconds%60
  ).padStart(2,'0');

  return minutes+':'+secs;
}

function buildPlaybackArea(){

  playbackArea.innerHTML=`

    <div class="scrub-wrap">

      <div class="time-row">
        <span id="curTime">0:00</span>
        <span id="totalTime">0:00</span>
      </div>

      <input
        type="range"
        class="scrub"
        min="0"
        max="100"
        value="0">

    </div>

    <div class="controls">

      <button
        class="toggle-btn"
        id="shuffleBtn"
        title="Shuffle">⇄</button>

      <button
        id="prevBtn"
        title="Previous">&#9198;</button>

      <button
        class="play-btn"
        id="playBtn"
        title="Play">&#9654;</button>

      <button
        id="nextBtn"
        title="Next">&#9197;</button>

      <button
        class="toggle-btn"
        id="repeatBtn"
        title="Auto play">↺</button>

    </div>
  `;

  document.getElementById('shuffleBtn')
    .addEventListener('click',e=>{
      e.currentTarget.classList.toggle('active');
    });

  document.getElementById('repeatBtn')
    .addEventListener('click',e=>{
      e.currentTarget.classList.toggle('active');
    });

  document.getElementById('prevBtn')
    .addEventListener('click',()=>{
      stepSong(-1);
    });

  document.getElementById('nextBtn')
    .addEventListener('click',()=>{
      stepSong(1);
    });

  document.getElementById('playBtn')
    .addEventListener('click',togglePlay);

  document.querySelector('.scrub')
    .addEventListener('input',e=>{

      if(!audio)return;

      if(Number.isFinite(audio.duration)){

        audio.currentTime=
          (e.target.value/100)*
          audio.duration;

      }

    });

}

/* =========================
   LOAD SONG
========================= */

function loadSong(index,autoplay=false){

  if(!songs[index])return;

  activeIndex=index;

  if(audio){

    audio.pause();

    URL.revokeObjectURL(
      audio.src
    );

  }

  const song=songs[index];

  audio=new Audio();

  audio.src=
    URL.createObjectURL(song.file);

  audio.preload='metadata';

  audio.addEventListener('loadedmetadata',()=>{

    document.getElementById('totalTime')
      .textContent=
      formatTime(audio.duration);

  });

  audio.addEventListener('timeupdate',()=>{

    const current=audio.currentTime;
    const duration=audio.duration;

    document.getElementById('curTime')
      .textContent=
      formatTime(current);

    document.getElementById('totalTime')
      .textContent=
      formatTime(duration);

    if(Number.isFinite(duration)){

      document.querySelector('.scrub').value=
        (current/duration)*100;

    }

  });

  audio.addEventListener('ended',()=>{

    const repeat=
      document.getElementById('repeatBtn')
        .classList.contains('active');

    if(repeat){
      audio.currentTime=0;
      audio.play();
      return;
    }

    nextSong(true);

  });

  renderSongs();

  if(autoplay){

    audio.play().then(()=>{
      updatePlayButton(true);
    }).catch(()=>{});

  }

}

/* =========================
   PLAY / PAUSE
========================= */

function togglePlay(){

  if(!songs.length)return;

  if(!audio){
    loadSong(activeIndex,true);
    return;
  }

  if(audio.paused){

    audio.play()
      .then(()=>{
        updatePlayButton(true);
      })
      .catch(()=>{});

  }else{

    audio.pause();

    updatePlayButton(false);

  }

}

function updatePlayButton(playing){

  const btn=
    document.getElementById('playBtn');

  if(!btn)return;

  btn.innerHTML=
    playing
      ? '&#10074;&#10074;'
      : '&#9654;';
}

/* =========================
   NEXT / PREVIOUS
========================= */

function nextSong(autoplay=false){

  if(!songs.length)return;

  const shuffle=
    document.getElementById('shuffleBtn')
      ?.classList.contains('active');

  let next;

  if(shuffle && songs.length>1){

    do{
      next=Math.floor(
        Math.random()*songs.length
      );
    }while(next===activeIndex);

  }else{

    next=
      (activeIndex+1)%songs.length;

  }

  loadSong(next,autoplay);
}

function stepSong(dir){

  if(!songs.length)return;

  let next=
    (activeIndex+dir+songs.length)
    %songs.length;

  loadSong(next,false);
}

/* =========================
   SONG NAME
========================= */

function cleanFilename(filename){

  return filename
    .replace(/\.[^/.]+$/,'')
    .trim();
}

function parseFilename(filename){

  const raw=cleanFilename(filename);

  if(raw.includes(' - ')){

    const parts=
      raw.split(' - ');

    return{
      artist:parts[0].trim()||'Unknown artist',
      name:parts.slice(1)
        .join(' - ')
        .trim()||raw
    };

  }

  return{
    artist:'Unknown artist',
    name:raw
  };
}

/* =========================
   IMPORT SONGS
========================= */

const songImport=
  document.getElementById('songImport');

songImport.addEventListener('change',e=>{

  handleSongFiles(e.target.files);

  e.target.value='';

});

async function handleSongFiles(files){

  for(const file of Array.from(files)){

    const parsed=
      parseFilename(file.name);

    const song={
      id:
        Date.now()+
        '-' +
        Math.random()
          .toString(36)
          .slice(2),

      name:parsed.name,

      artist:parsed.artist,

      file:file
    };

    songs.push(song);

    await saveSong(song);

    if(activeIndex===-1){
      activeIndex=0;
    }

  }

  if(!playbackArea.innerHTML.trim()){
    buildPlaybackArea();
  }

  renderSongs();

}

========================= */

function startDeleteTimer(div,index){

    div.classList.add('delete-mode');

function cancelDeleteTimer(){

}

function setupLongPress(div,index){

        )

  div.addEventListener(
    'pointerup',

    'pointercancel',
    cancelDeleteTimer
  );

  div.addEventListener(
    'pointerleave',
    cancelDeleteTimer
  );

}

/* =========================
   DELETE SONG
========================= */

async function deleteSong(index){

  if(!songs[index])return;

  const id=songs[index].id;

  if(
    audio &&
    index===activeIndex
  ){

    audio.pause();

    audio.src='';

    audio=null;

  }

  await deleteSavedSong(id);

  songs.splice(index,1);

  if(songs.length===0){

    activeIndex=-1;

  }else if(index===activeIndex){

    activeIndex=
      Math.min(index,songs.length-1);

  }else if(index<activeIndex){

    activeIndex--;

  }

  renderSongs();

}

/* =========================
   RENDER SONGS
========================= */

function renderSongs(){

  const hasSongs=songs.length>0;

  emptyState.style.display=
    hasSongs?'none':'block';

  songListEl.style.display=
    hasSongs?'flex':'none';

  playbackArea.style.display=
    hasSongs?'block':'none';

  if(hasSongs &&
     playbackArea.innerHTML.trim()===''){

    buildPlaybackArea();

  }

  songListEl.innerHTML='';

  songs.forEach((song,i)=>{

    const div=
      document.createElement('div');

    div.className=
      'song'+
      (i===activeIndex?' active':'');

    div.innerHTML=`

      <span class="drag-handle"></span>

      <span class="note">&#9835;</span>

      <div class="song-info">

        <span class="song-name"></span>

        <span class="artist-name"></span>

      </div>

      <button
        class="delete-song"
        title="Delete">×</button>
    `;

    div.querySelector('.song-name')
      .textContent=song.name;

    div.querySelector('.artist-name')
      .textContent=song.artist;

    const deleteBtn=
      div.querySelector('.delete-song');

    deleteBtn.addEventListener(
      'click',
      e=>{
        e.stopPropagation();
        deleteSong(i);
      }
    );

    div.addEventListener('click',()=>{

      if(div.classList.contains('delete-mode')){
        div.classList.remove('delete-mode');
        return;
      }

      if(activeIndex!==i){

        loadSong(i,false);

      }

    });

    setupLongPress(div,i);

    songListEl.appendChild(div);

  });

}

/* =========================
   LOAD SAVED DATA
========================= */

async function initialize(){

  try{

    await openDB();

    songs=await loadSavedSongs();

    if(songs.length){

      activeIndex=0;

      buildPlaybackArea();

    }

    renderSongs();

  }catch(error){

    console.error(
      'Could not load saved songs:',
      error
    );

    renderSongs();

  }

}

initialize();

/* =========================
   RESET
========================= */

document.getElementById('resetBtn')
  .addEventListener('click',()=>{

    setColor(
      'headerColor',
      '#8A8A8A'
    );

    setColor(
      'titleColor',
      '#1A1A1A'
    );

    setColor(
      'songTitleColor',
      '#1A1A1A'
    );

    setColor(
      'bgColor',
      '#FFFFFF'
    );

    playerEl.dataset.pattern='none';

    patternTiles.forEach(t=>{
      t.classList.toggle(
        'active',
        t.dataset.pattern==='none'
      );
    });

    patternOpacityRow
      .classList.remove('visible');

    root.style.setProperty(
      '--pattern-opacity',
      .35
    );

    patternOpacityRange.value=35;
    patternOpacityVal.textContent='35%';

    fontSelect.value=
      "'Montserrat',sans-serif";

    updateFont();

    root.style.setProperty(
      '--scale',
      1
    );

    scaleRange.value=100;
    scaleVal.textContent='100%';

    root.style.setProperty(
      '--text-scale',
      1
    );

    textScaleRange.value=100;
    textScaleVal.textContent='100%';

    root.style.setProperty(
      '--cover-size',
      '170px'
    );

    coverSizeRange.value=170;
    coverSizeVal.textContent='170px';

    cover.classList.remove(
      'square',
      'circle',
      'heart'
    );

    cover.classList.add('rounded');

    shapeButtons.forEach(b=>{
      b.classList.toggle(
        'active',
        b.dataset.shape==='rounded'
      );
    });

    titleText.textContent='Title';
    titleInput.value='Title';

  });

</script>
